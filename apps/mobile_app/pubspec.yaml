name: jibble_mobile
description: Jibble — college social platform mobile app
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: ">=3.13.0"

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.4.10
  riverpod_annotation: ^2.3.4

  # Navigation
  go_router: ^13.2.0

  # Networking
  dio: ^5.4.1
  retrofit: ^4.1.0

  # Real-time
  socket_io_client: ^2.0.3+1

  # Firebase
  firebase_core: ^2.24.2
  firebase_messaging: ^14.7.10

  # Local storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  shared_preferences: ^2.3.0

  # Media
  cached_network_image: ^3.3.1
  image_picker: ^1.1.2
  flutter_cache_manager: ^3.3.1

  # Utils
  logger: ^2.0.2+1
  equatable: ^2.0.5
  dartz: ^0.10.1
  get_it: ^7.6.7
  injectable: ^2.3.2
  connectivity_plus: ^5.0.2
  flutter_local_notifications: ^17.1.2
  intl: ^0.19.0
  uuid: ^4.3.3
  flutter_secure_storage: ^10.2.0
  lottie: ^3.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  build_runner: ^2.4.7
  riverpod_generator: ^2.3.9
  injectable_generator: ^2.4.1
  retrofit_generator: ^8.1.0
  json_serializable: ^6.7.1
  hive_generator: ^2.0.1

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/fonts/
    - assets/Lottie Animations/
